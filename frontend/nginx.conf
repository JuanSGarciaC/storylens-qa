server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # La API vive en el mismo origen que la interfaz: así la cookie de sesión del dueño funciona
  # sin CORS ni SameSite=None. `BACKEND_URL` es el servicio del backend en la red de Docker.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_read_timeout 120s;
  }

  # Aplicación de una sola página: cualquier otra ruta la resuelve el router del navegador.
  location / {
    try_files $uri /index.html;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
}
