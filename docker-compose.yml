# Todo el sistema en local: http://localhost:8080
#   cp .env.example .env   (y completa al menos OWNER_EMAIL, OWNER_PASSWORD y SESSION_SECRET)
#   docker compose up --build
# Sin esas tres variables solo se ve la demostración de solo lectura.
services:
  app:
    build: .
    env_file: .env
    environment:
      # En compose la base vive en el volumen, no en el contenedor.
      DATABASE_URL: sqlite:////data/storylens.db
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8080:8000"
    volumes:
      - storylens-data:/data
    restart: unless-stopped

volumes:
  storylens-data:
