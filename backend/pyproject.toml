[project]
name = "storylens-backend"
version = "0.1.0"
description = "Backend de StoryLens QA: revisión de historias de usuario con reglas QA e IA"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlmodel>=0.0.22",
    "google-genai>=1.0",
    "python-multipart>=0.0.9",
    "fpdf2>=2.8",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pre-commit>=4.0",
]
# Para PostgreSQL gratuito en la nube (Neon, Supabase): pip install -e ".[postgres]"
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["domain/rules/catalog/*.yaml", "prompts/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app/domain", "app/application"]
